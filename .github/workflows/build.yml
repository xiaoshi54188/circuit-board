name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.dir }} (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: 1.21.1
            java: 21
          - dir: 26.2
            java: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build
        working-directory: ${{ matrix.dir }}
        run: ./gradlew build --stacktrace

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: circuit-board-${{ matrix.dir }}
          path: ${{ matrix.dir }}/build/libs/*.jar
          if-no-files-found: warn
